<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Glow & Grace | Beauty Store</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #fff8fb;
    color: #292027;
}

header {
    background: #ffffff;
    padding: 20px 12px;
    text-align: center;
    border-bottom: 1px solid #f3dce7;
}

header h1 {
    color: #d63384;
    letter-spacing: 3px;
    font-size: 27px;
}

header p {
    margin-top: 7px;
    color: #777;
    font-size: 13px;
}

nav {
    background: #292027;
    padding: 14px 5px;
    text-align: center;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 0 9px;
    font-size: 13px;
}

.hero {
    background: linear-gradient(135deg, #f8c8dc, #fff0f6);
    text-align: center;
    padding: 55px 20px;
}

.hero h2 {
    font-size: 32px;
    margin-bottom: 15px;
}

.hero p {
    margin-bottom: 25px;
    color: #57424d;
}

.button {
    display: inline-block;
    background: #d63384;
    color: white;
    padding: 12px 22px;
    border: none;
    border-radius: 25px;
    text-decoration: none;
    cursor: pointer;
    font-size: 14px;
}

section {
    padding: 35px 16px;
}

.section-title {
    text-align: center;
    font-size: 25px;
    margin-bottom: 25px;
}

.products {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
}

.product {
    background: white;
    border-radius: 14px;
    overflow: hidden;
    text-align: center;
    box-shadow: 0 3px 12px #e9cbd8;
    padding-bottom: 18px;
}

.product-image {
    height: 125px;
    background: #fce4ef;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
}

.product h3 {
    font-size: 15px;
    margin: 14px 5px 8px;
}

.product p {
    color: #d63384;
    font-weight: bold;
    margin-bottom: 12px;
}

.product button {
    background: #292027;
    color: white;
    border: none;
    border-radius: 20px;
    padding: 9px 12px;
    cursor: pointer;
}

#cart {
    background: #fce4ef;
    text-align: center;
    border-radius: 15px;
    padding: 25px 10px;
}

#cart p {
    margin: 12px;
}

#cartItems {
    list-style: none;
    margin: 15px 0;
}
